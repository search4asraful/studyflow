version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studyflow_db
    environment:
      POSTGRES_USER: asraful
      POSTGRES_PASSWORD: UserPass#504
      POSTGRES_DB: studyflow
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
